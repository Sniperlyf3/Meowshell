name: CI

# GitHub's Ubuntu runners ship the Android NDK preinstalled, which is what
# makes the non-arm64 ABIs buildable here: they need the NDK's clang for
# external linking, and android/arm64 does not.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tailcat_ref:
        description: tailcat git ref override (blank uses tailcat.ref)
        default: ""
      android_api_level:
        description: minimum Android API level
        default: "21"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # cmd/meowshell's go.mod replaces github.com/tailscale/tailcat with a
      # local ./.tailcat-src checkout (see tailcatdial.go's doc comment for
      # why meowshell imports tailcat's own package at all: forwarding
      # through a tailcat destination dials via tailcat.Client, the same
      # way tailcat's own "forward"/"socks" subcommands do), so go vet/go
      # test need that directory to exist before either can even resolve
      # imports. A plain, unpatched clone is enough here: the two patches
      # below only change Android-specific networking behavior, irrelevant
      # to vetting/testing meowshell on this runner's own host platform.
      # ./build.sh (further down) later reuses and patches this same
      # checkout for the real cross-compiled build.
      - name: Fetch tailcat source (for go.mod's replace directive)
        env:
          SRC_REF: ${{ inputs.tailcat_ref }}
        run: |
          SRC_REF=${SRC_REF:-$(tr -d '[:space:]' < tailcat.ref)}
          git clone --depth=1 https://github.com/tailscale/tailcat.git .tailcat-src
          git -C .tailcat-src fetch --depth=1 origin "$SRC_REF"
          git -C .tailcat-src checkout --detach FETCH_HEAD

      - name: Vet and test meowshell
        env:
          # tailcat's go.mod asks for a newer Go than setup-go's stable may
          # be; let the toolchain fetch it rather than pinning a version here.
          GOTOOLCHAIN: auto
        run: |
          go vet ./...
          go test ./...

      - name: Scan Go call paths for known vulnerabilities
        env:
          GOTOOLCHAIN: auto
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Locate the NDK
        run: |
          ndk=${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::no Android NDK found on this runner" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using NDK at $ndk"
          cat "$ndk/source.properties" || true

      - name: Build
        env:
          # tailcat's go.mod asks for a newer Go than setup-go's stable may
          # be; let the toolchain fetch it rather than pinning a version here.
          GOTOOLCHAIN: auto
          SRC_REF: ${{ inputs.tailcat_ref }}
          ANDROID_API_LEVEL: ${{ inputs.android_api_level || '21' }}
        run: ./build.sh

      - name: Scan the patched tailcat build input for known vulnerabilities
        env:
          GOTOOLCHAIN: auto
        run: (cd .tailcat-src && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./cmd/tailcat)

      - name: Verify each binary targets the platform it claims
        run: ./verify-binaries.sh

      - name: Record what was built
        run: |
          {
            echo '### tailcat builds'
            echo
            echo "tailcat ref: \`$(git -C .tailcat-src rev-parse HEAD)\`"
            echo "go: \`$(go version | cut -d' ' -f3)\`"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailcat-binaries
          path: dist/
          if-no-files-found: error

  # Runs the binaries on a real Android system. The build job proves they are
  # shaped like Android executables; only this proves they work.
  emulator-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tailcat-binaries
          path: dist

      - name: Build a host tailcat to act as the client
        env:
          GOTOOLCHAIN: auto
          SRC_REF: ${{ inputs.tailcat_ref }}
        run: |
          SRC_REF=${SRC_REF:-$(tr -d '[:space:]' < tailcat.ref)}
          git clone --depth=1 https://github.com/tailscale/tailcat.git .tailcat-src
          git -C .tailcat-src fetch --depth=1 origin "$SRC_REF"
          git -C .tailcat-src checkout --detach FETCH_HEAD
          cd .tailcat-src
          go build -tags="$(tr -d '[:space:]' < build-tags.txt)" \
            -o "$GITHUB_WORKSPACE/tailcat-host" ./cmd/tailcat
          "$GITHUB_WORKSPACE/tailcat-host" version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # This action manages the AVD, boot wait, and emulator flags itself,
      # rather than driving the emulator by hand.
      - name: End-to-end test on the device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          HOST_TAILCAT: ${{ github.workspace }}/tailcat-host
          ABI: amd64
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot-save -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          script: ./e2e/android-e2e.sh

      - name: Device diagnostics (on failure)
        if: failure()
        # timeout guards against adb hanging on an already-gone device.
        run: timeout 15 adb logcat -d -t 40 "*:E" 2>/dev/null || true

  # The same coverage as the emulator test, on the runner itself: no device
  # to boot, so it is fast and cannot be flaky for reasons of its own.
  host-e2e:
    needs: build
    strategy:
      fail-fast: false
      # Each matrix entry now starts its own local relay (see
      # ../e2e/README.md) instead of sharing the public one, so this no
      # longer guards against a shared-relay load race -- left at 1 as a
      # deliberate choice to keep, not because it's still load-bearing.
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tailcat-binaries
          path: dist

      - name: Start a local DERP relay for the E2E tests
        run: ./e2e/start-testderp.sh

      - name: End-to-end test on this host
        env:
          TAILCAT: dist/tailcat_linux_${{ matrix.arch }}
          MEOWSHELL: dist/meowshell_linux_${{ matrix.arch }}
        run: ./e2e/host-e2e.sh

      - name: Stop the local DERP relay
        if: always()
        run: kill "$(cat /tmp/testderp.pid)" 2>/dev/null || true

  # The only place the Windows binaries are executed. meowshell is a
  # launcher there, so this covers the launcher, the session, and the key
  # staging that has to work differently without unlink-while-open.
  windows-e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      # See the "build" job's own comment: cmd/meowshell's go.mod replaces
      # github.com/tailscale/tailcat with a local ./.tailcat-src checkout, so
      # go vet/go test need it present before either can resolve imports.
      - name: Fetch tailcat source (for go.mod's replace directive)
        shell: bash
        env:
          SRC_REF: ${{ inputs.tailcat_ref }}
        run: |
          SRC_REF=${SRC_REF:-$(tr -d '[:space:]' < tailcat.ref)}
          git clone --depth=1 https://github.com/tailscale/tailcat.git .tailcat-src
          git -C .tailcat-src fetch --depth=1 origin "$SRC_REF"
          git -C .tailcat-src checkout --detach FETCH_HEAD

      # Some of cmd/meowshell's Windows-specific code (known_hosts DACL/SID
      # validation, N9) only builds and runs under GOOS=windows, so it never
      # gets exercised by the "build" job's own go vet/go test, which run on
      # ubuntu-latest -- this is the only place in CI a real Windows host
      # actually type-checks and runs that code.
      - name: Vet and test meowshell on Windows
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          go vet ./...
          go test ./...

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tailcat-binaries
          path: dist

      - name: Start a local DERP relay for the E2E tests
        shell: pwsh
        run: ./e2e/start-testderp.ps1

      - name: End-to-end test on Windows
        shell: pwsh
        run: ./e2e/windows-e2e.ps1

      - name: Stop the local DERP relay
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP\testderp.pid"
          if (Test-Path $pidFile) {
            Stop-Process -Id (Get-Content $pidFile) -ErrorAction SilentlyContinue
          }

  # The .NET integration is independent of the Android binaries, so it builds
  # in parallel rather than waiting on them.
  dotnet:
    # The runtime packages carry the binaries, so this waits for them.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tailcat-binaries
          path: dist

      - name: Create the local nupkg feed directory
        # dotnet/nuget.config lists ./nupkg as a package
        # source so Meowshell can later restore its own runtime-package
        # dependencies (see IncludeRuntimeDependencies there). A configured
        # local folder source that does not exist on disk yet fails restore
        # outright (NU1301) on this runner's NuGet client, even for
        # projects that need nothing from it -- which is every project
        # until the Pack step below has run once.
        run: mkdir -p nupkg

      - name: Audit NuGet dependencies
        run: |
          dotnet restore dotnet/Meowshell.sln --force --no-cache --nologo
          dotnet restore scripts/CommentStripper/CommentStripper.csproj --force --no-cache --nologo

      - name: Start a local DERP relay for the E2E tests
        run: ./e2e/start-testderp.sh

      - name: Test
        # The E2E tests in Meowshell.Tests run against these real binaries
        # instead of the fake stand-ins the rest of the suite uses; they
        # no-op locally when the variables are unset (see
        # MeowshellServerE2ETests.RealBinaries). TAILCAT_DERPMAP_URL (set by
        # the relay step above) reaches the real tailcat processes these
        # tests spawn via plain environment inheritance -- MeowshellServer
        # and MeowshellAgentConnection never touch it themselves.
        env:
          DOTNET_E2E_TAILCAT_BIN: ${{ github.workspace }}/dist/tailcat_linux_amd64
          DOTNET_E2E_MEOWSHELL_BIN: ${{ github.workspace }}/dist/meowshell_linux_amd64
        run: |
          for i in $(seq 1 10); do
            echo "::group::.NET stress pass $i/10"
            dotnet test dotnet/Meowshell.sln -c Release --nologo \
              --logger "trx;LogFileName=meowshell-tests-$i.trx" \
              --results-directory test-results
            echo "::endgroup::"
          done

      - name: Upload .NET test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: test-results/
          if-no-files-found: warn

      - name: Install the Android workload
        # Needed to pack Meowshell's android-targeted build below.
        run: dotnet workload install android

      - name: Pack the runtime packages, then the library that depends on them
        # Order matters: Meowshell is packed with
        # -p:IncludeRuntimeDependencies=true, which adds these as real
        # dependencies (see Meowshell.csproj) and needs them already
        # sitting in ./nupkg to restore against. BuildNumber makes every
        # package in this run share one version (see
        # dotnet/Directory.Build.props) -- the patch component is never
        # hand-edited.
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          for family in android linux windows; do
            dotnet pack dotnet/Meowshell.Runtime \
              -c Release -p:Family="$family" -p:BinDir="$PWD/dist" -p:BuildNumber="$BUILD_NUMBER" \
              -o nupkg --nologo
          done
          dotnet pack dotnet/Meowshell/Meowshell.csproj \
            -c Release -p:IncludeAndroidTarget=true -p:IncludeRuntimeDependencies=true -p:BuildNumber="$BUILD_NUMBER" \
            -o nupkg --nologo
          ls -la nupkg

      - name: A consumer must find the binaries through the package alone
        run: ./dotnet/verify-package.sh

      - name: MeowshellServer must also find them, with no help from the caller
        # Meowshell.Tests references the library by ProjectReference, so
        # it cannot catch a broken package layout (wrong RID folder, wrong
        # file name, a missing executable bit) -- only consuming the actual
        # nupkg does. Not part of Meowshell.sln: it can only run after
        # the pack step above. BuildNumber must match the pack step's, so
        # its PackageReference resolves to the version just packed.
        run: dotnet test dotnet/Meowshell.PackageTests -c Release -p:BuildNumber="${{ github.run_number }}" --nologo

      - name: Stop the local DERP relay
        # Meowshell.PackageTests above also runs real-binary E2E tests, so
        # this has to wait until every step that could need the relay is
        # done, not just the "Test" step above it.
        if: always()
        run: kill "$(cat /tmp/testderp.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: nupkg/*
          if-no-files-found: error

  # Meowshell.Demo: a real, installable app, not just a pass/fail check.
  # One button generates a fresh throwaway shell address, one field copies
  # it. Published as a single universal APK bundling all four ABIs, the
  # same approach Meowshell.AndroidProbe already uses successfully (see
  # dotnet/android/issues/9763 upstream for why a per-ABI split isn't
  # worth pursuing with the current .NET for Android toolchain).
  dotnet-android-demo:
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install the Android workload
        run: dotnet workload install android

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: nupkg

      - name: Publish the demo APK
        # BuildNumber must match the "dotnet" job's pack step, so the
        # Meowshell PackageReference resolves to the version just packed.
        run: |
          dotnet publish dotnet/Meowshell.Demo -c Release -f net10.0-android36.0 \
            -p:BuildNumber="${{ github.run_number }}" -o publish-out --nologo

          mkdir -p demo-apks
          apk=$(find publish-out -iname "*-Signed.apk" | head -1)
          [ -n "$apk" ] || apk=$(find publish-out -iname "*.apk" | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no APK produced"
            find publish-out -type f
            exit 1
          fi
          cp "$apk" demo-apks/meowshell-demo.apk
          ls -la demo-apks

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meowshell-demo-apks
          path: demo-apks/*
          if-no-files-found: error

  # BinaryLocator's generic search does not apply on Android -- native
  # libraries land under ApplicationInfo.NativeLibraryDir, not the app's
  # base directory -- so nothing above exercises the path a real Android
  # app actually uses to find them. Only a real .NET-for-Android build,
  # installed and run on a device, proves Meowshell.Runtime.android's
  # layout is one .NET for Android actually extracts and can execute.
  dotnet-android-e2e:
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install the Android workload
        run: dotnet workload install android

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: nupkg

      - name: Build the probe app against the packages, not this repo's source
        # BuildNumber must match the "dotnet" job's pack step, so the
        # Meowshell PackageReference resolves to the version just packed.
        run: dotnet build dotnet/Meowshell.AndroidProbe -c Release -f net10.0-android36.0 -p:BuildNumber="${{ github.run_number }}" --nologo

      - name: Build a host tailcat to act as the client
        # Same approach as emulator-e2e's equivalent step: proves the probe
        # serves a real, working shell -- not just that Start() returned an
        # address -- by having a real client dial in and run commands.
        env:
          GOTOOLCHAIN: auto
          SRC_REF: ${{ inputs.tailcat_ref }}
        run: |
          SRC_REF=${SRC_REF:-$(tr -d '[:space:]' < tailcat.ref)}
          git clone --depth=1 https://github.com/tailscale/tailcat.git .tailcat-src
          git -C .tailcat-src fetch --depth=1 origin "$SRC_REF"
          git -C .tailcat-src checkout --detach FETCH_HEAD
          cd .tailcat-src
          go build -tags="$(tr -d '[:space:]' < build-tags.txt)" \
            -o "$GITHUB_WORKSPACE/tailcat-host" ./cmd/tailcat
          "$GITHUB_WORKSPACE/tailcat-host" version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the probe on the device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          HOST_TAILCAT: ${{ github.workspace }}/tailcat-host
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot-save -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          script: ./dotnet/android-probe-e2e.sh

      - name: Device diagnostics (on failure)
        if: failure()
        # timeout guards against adb hanging once the emulator is torn down.
        run: timeout 15 adb logcat -d -t 60 "*:E" 2>/dev/null || true

  # Publishes to nuget.org via trusted publishing (OIDC) -- no long-lived
  # API key stored anywhere; NuGet/login exchanges this job's GitHub-issued
  # OIDC token for a short-lived one, scoped to a trusted publishing policy
  # configured on nuget.org for this exact repo/workflow/environment. Only
  # a tag push can ever satisfy this condition -- never a pull_request,
  # fork or otherwise -- so this job cannot run as part of reviewing
  # someone else's changes. The "nuget-publish" environment additionally
  # lets a required-reviewer rule be added in repo settings, so even a
  # maintainer's own tag push can be made to wait for a manual approval
  # before publishing.
  publish:
    needs: [dotnet, dotnet-android-demo, dotnet-android-e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet/login's OIDC token exchange
    environment: nuget-publish
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: nupkg

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, NOT email

      - name: Push packages to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
