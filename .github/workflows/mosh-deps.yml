name: Mosh dependency sums

on:
  push:
    branches: [feature/mosh-agent]

permissions:
  contents: write

jobs:
  sums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Fetch tailcat source
        run: |
          SRC_REF=$(tr -d '[:space:]' < tailcat.ref)
          git clone --depth=1 https://github.com/tailscale/tailcat.git .tailcat-src
          git -C .tailcat-src fetch --depth=1 origin "$SRC_REF"
          git -C .tailcat-src checkout --detach FETCH_HEAD
      - name: Tidy and commit Mosh dependencies
        run: |
          go mod tidy
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo "Dependencies already tidy."
            exit 0
          fi
          git commit -m "Tidy Mosh dependencies"
          git push origin HEAD:feature/mosh-agent
