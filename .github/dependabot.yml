version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Must equal the version tailcat.ref's own go.mod pins; build.sh fails
      # otherwise. It moves together with tailcat.ref, never on its own.
      - dependency-name: tailscale.com

  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: nuget
    directory: /scripts/CommentStripper
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
